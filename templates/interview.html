<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interview Session - AI Coach</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="progress-text">Question {{ current_num }} of {{ total_questions }}</div>
            
            {% if error_message %}
            <div class="error-banner" style="background-color: #fee2e2; border: 1px solid #f87171; color: #991b1b; padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; font-size: 0.95rem; font-weight: 500;">
                ⚠️ {{ error_message }}
            </div>
            {% endif %}

            <h2 class="question-title">{{ question.question_text }}</h2>

            <form action="{{ url_for('submit_answer') }}" method="POST">
                <input type="hidden" name="session_id" value="{{ session_id }}">
                <input type="hidden" name="question_id" value="{{ question.id }}">

                <div class="form-group">
                    <textarea name="answer_text" placeholder="Type your answer here..." required autofocus>{{ previous_answer if previous_answer else '' }}</textarea>
                </div>

                <div style="text-align: right;">
                    <button type="submit" class="btn btn-primary">Submit Answer</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
